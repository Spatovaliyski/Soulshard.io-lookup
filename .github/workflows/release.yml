name: Request addon release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  request:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request tagged release
        env:
          BUILDER_DISPATCH_TOKEN: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const tag = process.env.GITHUB_REF_NAME;
          const token = process.env.BUILDER_DISPATCH_TOKEN;

          if (!/^v\d+\.\d+\.\d+$/.test(tag ?? ''))
            throw new Error('Release tags must use numeric vX.Y.Z.');
          if (!token)
            throw new Error('Configure the BUILDER_DISPATCH_TOKEN Actions secret before enabling release requests.');

          const response = await fetch(
            'https://api.github.com/repos/Spatovaliyski/armory/actions/workflows/addon-release.yml/dispatches',
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                ref: 'main',
                inputs: { source_ref: tag, publish: 'true' },
              }),
              signal: AbortSignal.timeout(30_000),
            },
          );

          if (response.status !== 204)
            throw new Error(`Release request failed (HTTP ${response.status}).`);
          console.log(`Release requested for ${tag}.`);
          NODE
